version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: taskmaster-mongo
    restart: unless-stopped
    ports:
      - "27017:27017" # expone para que tu backend local o containers se conecten
    environment:
      MONGO_INITDB_DATABASE: taskmaster
    volumes:
      - mongo_data:/data/db # persistencia de datos

volumes:
  mongo_data:
